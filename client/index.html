<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- <link rel="icon" type="image/svg+xml" href="/favicon.svg" /> -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/brand/favicon-32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="/brand/favicon-16.png"
    />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#111827" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Campaign Notes</title>
    <script>
      (function () {
        try {
          const t = localStorage.getItem("theme");
          const h = localStorage.getItem("accentHue");
          const s = localStorage.getItem("accentSaturation");
          if (t === "dark" || t === "light") {
            document.documentElement.setAttribute("data-theme", t);
          } else if (t === "system" || !t) {
            document.documentElement.setAttribute(
              "data-theme",
              window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light",
            );
          }
          if (h) document.documentElement.style.setProperty("--accent-hue", h);
          if (s)
            document.documentElement.style.setProperty(
              "--accent-saturation",
              `${s}%`,
            );
        } catch {
          // ignore localStorage errors
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
